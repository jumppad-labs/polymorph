image:
  repository: ghcr.io/jumppad-labs/polymorph
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

config: |
  service "http" "api" {
    listen = "0.0.0.0:8080"

    handle "health" {
      route = "GET /health"
      response {
        body = jsonencode({ status = "healthy" })
      }
    }
  }

resources:
  limits:
    cpu: 250m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi
